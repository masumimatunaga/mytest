<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルサイト</title>
</head>
<body>
  <h1>オリジナルサイト</h1>
  
  <h2>はじめまして。まつながますみです。</h2>
  <h2 id="message">はじめてのオリジナルサイトです！</h2>
  <button id="change-btn">クリックしてね</button>
   
  <script>
    const btn=document.getElementById('change-btn');
    const msg=document.getElementById('message');

    btn.addEventListener('click', function() {
      msg.textContent='これからもよろしくお願いします！';
    });
  
  </script>
  
</body>
</html>
